<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — LNMIIT Library Management System</title>
  <meta name="description" content="View and update your LNMIIT Library profile." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-pattern"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <div class="navbar-brand">
        <div class="brand-icon">📚</div>
        <span>LNMIIT Library</span>
      </div>
      <div class="navbar-nav">
        <a href="profile.html" class="nav-link active">My Profile</a>
        <a href="change-password.html" class="nav-link">Change Password</a>
      </div>
      <div class="navbar-user">
        <span id="nav-user-name" style="color:var(--text-secondary);font-size:0.875rem;"></span>
        <div class="avatar" id="nav-avatar" title="Profile"></div>
        <button class="btn btn-secondary btn-sm" id="logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:32px;padding-bottom:48px;">

    <!-- Page Header -->
    <div class="page-header">
      <h1>My Profile</h1>
      <p>View and manage your personal information</p>
    </div>

    <!-- Alert -->
    <div id="alert-box"></div>

    <div class="grid-2" style="gap:28px;align-items:start;">

      <!-- Profile Card -->
      <div class="card" id="profile-card">
        <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px;">
          <div class="avatar-preview" id="profile-avatar" style="width:72px;height:72px;font-size:1.6rem;">?</div>
          <div>
            <div style="font-size:1.15rem;font-weight:700;" id="profile-name">Loading...</div>
            <div style="margin-top:6px;" id="profile-role"></div>
            <div style="margin-top:6px;" id="profile-status"></div>
          </div>
        </div>

        <div style="display:grid;gap:14px;">
          <div class="info-row">
            <span class="info-label">Email</span>
            <span id="info-email" class="info-value">—</span>
          </div>
          <div class="info-row" id="userid-row" style="display:none;">
            <span class="info-label" id="info-userid-label">User ID</span>
            <span id="info-userid" class="info-value">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Phone</span>
            <span id="info-phone" class="info-value">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Address</span>
            <span id="info-address" class="info-value">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Member Since</span>
            <span id="info-since" class="info-value">—</span>
          </div>
        </div>
      </div>

      <!-- Edit Profile Form -->
      <div class="card">
        <div class="card-title" style="margin-bottom:20px;">Edit Profile</div>
        <div id="edit-alert"></div>
        <form id="edit-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="edit-name">Full Name</label>
            <input type="text" id="edit-name" class="form-control" placeholder="Your full name" />
            <span class="form-error" id="edit-name-error">Name is required.</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-phone">Phone Number</label>
            <input type="tel" id="edit-phone" class="form-control" placeholder="10-digit mobile number" />
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-address">Address</label>
            <textarea id="edit-address" class="form-control" rows="3" placeholder="Your address"
              style="resize:vertical;"></textarea>
          </div>
          <div class="form-group" id="edit-userid-group" style="display:none;">
            <label class="form-label" id="edit-userid-label" for="edit-userid">User ID</label>
            <input type="text" id="edit-userid" class="form-control" />
          </div>
          <button type="submit" class="btn btn-primary" id="save-btn">
            <span id="save-text">Save Changes</span>
            <span id="save-spinner" class="spinner" style="display:none;"></span>
          </button>
        </form>
      </div>

      <!-- Issued Books -->
      <div class="card" id="issued-books-section" style="display:none; grid-column: 1 / -1;">
        <div class="card-title" style="margin-bottom:20px;">Issued Books</div>
        <div class="table-responsive">
          <table class="table" id="issued-books-table" style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr style="border-bottom: 2px solid var(--border); text-align: left;">
                <th style="padding: 12px; color: var(--muted-foreground); font-weight: 500;">Book Title</th>
                <th style="padding: 12px; color: var(--muted-foreground); font-weight: 500;">Issue Date</th>
                <th style="padding: 12px; color: var(--muted-foreground); font-weight: 500;">Return Date</th>
                <th style="padding: 12px; color: var(--muted-foreground); font-weight: 500;">Status</th>
              </tr>
            </thead>
            <tbody id="issued-books-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
        <div id="no-books-msg" style="text-align:center; padding: 30px; color: var(--text-secondary); display: none;">
          You currently have no books issued.
        </div>
      </div>

    </div>
  </div>

  <style>
    .info-row { display:flex; justify-content:space-between; align-items:flex-start;
      padding:10px 0; border-bottom:1px solid var(--border-color); }
    .info-row:last-child { border-bottom:none; }
    .info-label { font-size:0.78rem; font-weight:600; text-transform:uppercase;
      letter-spacing:0.04em; color:var(--text-muted); flex-shrink:0; margin-right:16px; }
    .info-value { font-size:0.875rem; color:var(--text-primary); text-align:right; }
  </style>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
