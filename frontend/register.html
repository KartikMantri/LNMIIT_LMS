<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — LNMIIT Library Management System</title>
  <meta name="description" content="Create your LNMIIT Library account as a Student or Faculty member." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-pattern"></div>

  <main class="auth-page" style="padding: 40px 24px;">
    <div class="auth-card" style="max-width:520px;">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon">📚</div>
        <div>
          <div style="font-size:0.95rem;">LNMIIT Library</div>
          <div style="font-size:0.7rem;font-weight:400;color:var(--text-muted);">Management System</div>
        </div>
      </div>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the LNMIIT Library portal</p>

      <!-- Alert Box -->
      <div id="alert-box"></div>

      <form id="register-form" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <div class="input-icon-wrapper">
            <span class="icon">👤</span>
            <input type="text" id="name" class="form-control" placeholder="Enter your full name" required />
          </div>
          <span class="form-error" id="name-error">Full name is required.</span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-icon-wrapper">
            <span class="icon">✉️</span>
            <input type="email" id="email" class="form-control" placeholder="you@lnmiit.ac.in" required />
          </div>
          <span class="form-error" id="email-error">Please enter a valid email.</span>
        </div>

        <!-- Role -->
        <div class="form-group">
          <label class="form-label" for="role">Role</label>
          <div class="input-icon-wrapper">
            <span class="icon">🏷️</span>
            <select id="role" class="form-control" required>
              <option value="" disabled selected>Select your role</option>
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
            </select>
          </div>
          <span class="form-error" id="role-error">Please select a role.</span>
        </div>

        <!-- User ID (Dynamic Label based on role) -->
        <div class="form-group" id="userid-group" style="display:none;">
          <label class="form-label" id="userid-label" for="userId">User ID</label>
          <div class="input-icon-wrapper">
            <span class="icon" id="userid-icon">🎫</span>
            <input type="text" id="userId" class="form-control" placeholder="Enter ID" />
          </div>
          <span class="form-error" id="userid-error">User ID is required.</span>
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <div class="input-icon-wrapper">
            <span class="icon">📞</span>
            <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrapper">
            <span class="icon">🔒</span>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required />
            <span class="icon-right" id="toggle-pwd">👁️</span>
          </div>
          <span class="form-error" id="password-error">Password must be at least 6 characters.</span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="input-icon-wrapper">
            <span class="icon">🔒</span>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required />
          </div>
          <span class="form-error" id="confirm-error">Passwords do not match.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-btn">
          <span id="btn-text">Create Account</span>
          <span id="btn-spinner" class="spinner" style="display:none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>

    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
