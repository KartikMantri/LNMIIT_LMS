<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — LNMIIT Library Management System</title>
  <meta name="description" content="Login to LNMIIT Library Management System to access your account." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-pattern"></div>

  <main class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon">LMS</div>
        <div>
          <div style="font-size:0.95rem;">LNMIIT Library</div>
          <div style="font-size:0.7rem;font-weight:400;color:var(--muted-foreground);">Management System</div>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <!-- Alert Box -->
      <div id="alert-box"></div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="userId">User ID</label>
          <input
            type="text" id="userId" name="userId"
            class="form-control" placeholder="Roll No / Faculty ID / admin"
            autocomplete="username" required
          />
          <span class="form-error" id="userid-error">Please enter your User ID.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Login As</label>
          <select id="role" name="role" class="form-control" required>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative;">
            <input
              type="password" id="password" name="password"
              class="form-control" placeholder="Enter your password"
              autocomplete="current-password" required
              style="padding-right:60px;"
            />
            <span id="toggle-password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:0.75rem;color:var(--muted-foreground);user-select:none;">Show</span>
          </div>
          <span class="form-error" id="password-error">Password is required.</span>
        </div>



        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
          <span id="btn-text">Sign In</span>
          <span id="btn-spinner" class="spinner" style="display:none;"></span>
        </button>
      </form>

      <div class="auth-divider">or</div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>

    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
